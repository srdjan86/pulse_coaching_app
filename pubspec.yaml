name: pulse_coaching_app
description: Pulse coaching MVP — AI-assisted Flutter delivery demo with BLoC, MVVM, flavors, and CI.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  equatable: ^2.0.7
  flutter_bloc: ^9.1.1
  get_it: ^8.0.3
  go_router: ^16.0.0
  intl: any
  provider: ^6.1.5
  shared_preferences: ^2.5.3

  # Backend examples — swap via BACKEND dart-define (mock | firebase | supabase)
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  supabase_flutter: ^2.9.1
  video_player: ^2.11.1
  chewie: ^1.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
