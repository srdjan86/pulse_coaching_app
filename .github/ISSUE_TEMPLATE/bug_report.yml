name: Bug report
description: Report something broken in the template or sample features
title: '[Bug] '
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: flavor
    attributes:
      label: Flavor / backend
      placeholder: dev + mock
    validations:
      required: false

  - type: input
    id: flutter-version
    attributes:
      label: Flutter version
      placeholder: flutter --version
    validations:
      required: false
