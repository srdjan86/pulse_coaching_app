name: Issue Planning Agent

on:
  issues:
    types: [labeled]

# One plan at a time per issue — cancel if the label is applied twice quickly.
concurrency:
  group: issue-plan-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  issues: write
  contents: read

jobs:
  plan:
    name: Generate Implementation Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only run when the "ready-for-planning" label is applied.
    if: github.event.label.name == 'ready-for-planning'
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: scripts/package-lock.json

      - name: Install planning agent dependencies
        run: npm ci
        working-directory: scripts

      - name: Run planning agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node plan_issue.mjs
        working-directory: scripts
